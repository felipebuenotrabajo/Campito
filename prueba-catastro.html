<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba Catastro</title>
<style>body{font:15px system-ui,sans-serif;margin:0;padding:16px;max-width:760px;margin-inline:auto;background:#fafaf7;color:#222}
h1{font-size:20px}button{padding:8px 14px;margin:6px 6px 6px 0;font-size:15px}.ok{color:#0a7a2f}.ko{color:#b00020}
textarea{background:#fff;border:1px solid #ccc;padding:8px;width:100%;box-sizing:border-box;font:12px monospace}</style></head><body>
<h1>Prueba de Catastro por coordenadas</h1>
<p>Pregunta a Catastro qué referencia catastral hay en un punto de la parcela y comprueba que polígono y parcela coinciden con los tuyos.</p>
<button id="a">1. Probar Monjitas (ya conocida)</button><button id="b">2. Probar 8 parcelas más</button>
<div id="res"></div><h3>Informe (cópialo y pégamelo)</h3><textarea id="inf" rows="14" readonly></textarea>
<script>
const URL_=(lat,lon)=>`https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCoordenadas.asmx/Consulta_RCCOOR?SRS=EPSG:4326&Coordenada_X=${lon}&Coordenada_Y=${lat}`;
const P=[['MONJITAS',152,5,32,38.62789,-6.52734],['CASABLANCA',152,3,492,38.65727,-6.56553],['LUMBRARILLO',152,12,415,38.60609,-6.52398],['CINCHO',121,8,16,38.6431,-6.60064],['EL MOSCO',121,9,57,38.6453,-6.59283],['MESAS',54,2,30,38.58773,-6.48413],['PEDRAZA',2,9,193,38.64045,-6.44904],['LAS COLEGIATAS',152,2,222,38.68415,-6.56717],['EL ASIENTO',152,12,279,38.61444,-6.54579]];
const inf=[];const $=id=>document.getElementById(id);
function log(t,c){const d=document.createElement('div');d.className=c||'';d.textContent=t;$('res').appendChild(d);inf.push(t);$('inf').value=inf.join('\n')}
async function una([n,m,pol,par,lat,lon]){
 log(`\n== ${n} (mun ${m}, pol ${pol}, parc ${par}) punto ${lat},${lon}`);
 let r;try{r=await fetch(URL_(lat,lon))}catch(e){log('FALLO de red/CORS: '+e.message,'ko');return}
 const t=await r.text();log('HTTP '+r.status);
 const x=new DOMParser().parseFromString(t,'text/xml');
 const g=s=>(x.getElementsByTagName(s)[0]||{}).textContent;
 const rc=(g('pc1')||'')+(g('pc2')||'');
 if(rc.length<14){log('Sin referencia. Respuesta: '+t.slice(0,400),'ko');return}
 log('Referencia: '+rc+' · dirección: '+(g('ldt')||''));
 const polC=parseInt(rc.slice(6,9),10),parC=parseInt(rc.slice(9,14),10),munC=parseInt(rc.slice(2,5),10);
 const ok=polC===pol&&parC===par;
 log(`Catastro dice pol ${polC} parc ${parC} (mun ${munC}) → ${ok?'COINCIDE':'NO COINCIDE'}`,ok?'ok':'ko');
}
$('a').onclick=async()=>{await una(P[0])};
$('b').onclick=async()=>{for(const p of P.slice(1))await una(p)};
</script></body></html>
